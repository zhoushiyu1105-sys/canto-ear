<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>港話聽力課</title>
<meta name="theme-color" content="#0b6b4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="港話聽力">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* What the claude.ai skeleton used to provide */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one column "route" — a minibus-plate header, tab strip, then cards; the 8-week plan drawn as an MTR-style line */
:root{
  --paper:#f2f5f2; --card:#ffffff; --ink:#14211c; --muted:#5a6a63; --line:#d3dcd6;
  --green:#0b6b4d; --green-soft:#e1efe8; --red:#c4302a; --red-soft:#fbe7e5; --amber:#a76a00; --amber-soft:#fbf0d9;
  --on-green:#ffffff;
  --f-display:"Songti TC","Noto Serif HK","PMingLiU",serif;
  --f-body:"PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1512; --card:#151f1b; --ink:#e4ebe7; --muted:#93a39b; --line:#26342e;
  --green:#3dbb8b; --green-soft:#16302a; --red:#ff6f62; --red-soft:#3a1d1b; --amber:#f0b44c; --amber-soft:#3a2d12;
  --on-green:#06130e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1512; --card:#151f1b; --ink:#e4ebe7; --muted:#93a39b; --line:#26342e;
  --green:#3dbb8b; --green-soft:#16302a; --red:#ff6f62; --red-soft:#3a1d1b; --amber:#f0b44c; --amber-soft:#3a2d12;
  --on-green:#06130e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* Minibus plate header */
.plate{background:var(--green);color:var(--on-green);border-radius:10px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.plate h1{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:900;letter-spacing:.04em}
.plate .sub{font-size:.85rem;opacity:.9}
.plate .stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.plate .stats b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.plate .stats span{font-size:.75rem;letter-spacing:.06em;opacity:.85}

nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--red)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:14px;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:500;background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice{border-radius:8px;padding:12px 14px;background:var(--amber-soft);color:var(--ink);font-size:.9rem}
.notice b{color:var(--amber)}
ul.clean{margin:0;padding-left:1.2em;display:grid;gap:4px}

/* Daily routine timeline */
.routine{display:grid;gap:0}
.routine .step{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.routine .step:first-child{border-top:0}
.routine .min{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--red);font-weight:500}

/* MTR-style 8-week line */
.mtr{display:grid;gap:0;position:relative}
.station{display:grid;grid-template-columns:28px 1fr;gap:14px;position:relative;padding-bottom:16px}
.station:before{content:"";position:absolute;left:12px;top:14px;bottom:-2px;width:4px;background:var(--green)}
.station:last-child:before{display:none}
.station .dot{width:28px;height:28px;border-radius:50%;background:var(--card);border:4px solid var(--green);z-index:1;display:grid;place-items:center;font-size:.72rem;font-weight:700;font-family:var(--f-mono)}
.station.now .dot{background:var(--green);color:var(--on-green)}
.station.done .dot{background:var(--green-soft)}
.station .body{min-width:0;display:grid;gap:4px}
.station .lessons{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.lchip{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.85rem;text-decoration:none;color:var(--ink);background:var(--card)}
.lchip.done{background:var(--green-soft);border-color:transparent;color:var(--green)}
.lchip:hover{border-color:var(--green)}

/* Lesson */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:8px 0;z-index:5}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:.85rem;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.line{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.line:first-child{border-top:0}
.line .spk{font-size:.75rem;color:var(--muted);grid-column:2}
.line .yue{font-size:1.15rem;grid-column:2;transition:filter .2s}
.line .zh{font-size:.85rem;color:var(--muted);grid-column:2}
.line .play{grid-row:1 / span 3}
.blind .yue{filter:blur(7px);user-select:none}
/* Jyutping ruby */
.yue ruby{ruby-position:over;margin:0 .06em;line-height:1}
.yue rt{font-family:var(--f-mono);font-size:.56em;color:var(--red);letter-spacing:0;font-weight:500;padding-bottom:2px}
.yue rt[data-tone="1"],.yue rt[data-tone="2"]{color:var(--red)}
.yue rt[data-tone="3"]{color:var(--amber)}
.yue rt[data-tone="4"],.yue rt[data-tone="5"],.yue rt[data-tone="6"]{color:var(--green)}
.yue ruby.en{margin:0 .3em}
.yue.has-jp{line-height:2.3}
.hidejp .yue rt{visibility:hidden}
.hidejp .yue.has-jp{line-height:1.65}
.hidejp .jpline{display:none}
.jpline{display:block;font-family:var(--f-mono);font-size:.8rem;color:var(--red)}
.tones{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:520px){.tones{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tone{border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--card);cursor:pointer;display:grid;gap:2px;justify-items:center;text-align:center}
.tone:hover{border-color:var(--green)}
.tone .c{font-size:1.5rem;font-weight:700;line-height:1.2}
.tone .j{font-family:var(--f-mono);font-size:.85rem}
.tone .d{font-size:.75rem;color:var(--muted)}
.tone svg{width:44px;height:22px}
.tone svg path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}
.tone.t-hi{color:var(--red)} .tone.t-mid{color:var(--amber)} .tone.t-lo{color:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.hidezh .zh{display:none}
.line.speaking .yue{color:var(--green)}
.playbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0}
.playbtn:hover{border-color:var(--green);color:var(--green)}
.playbtn svg{width:14px;height:14px;fill:currentColor}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;cursor:pointer;background:var(--card);text-align:left}
.vcard:hover{border-color:var(--green)}
.vcard .w{font-size:1.15rem;font-weight:700}
.vcard .j{font-family:var(--f-mono);font-size:.82rem;color:var(--red)}
.vcard .m{font-size:.85rem;color:var(--muted)}
.q{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--card);cursor:pointer}
.opt:hover{border-color:var(--green)}
.opt.right{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:5px;accent-color:var(--green);width:16px;height:16px;flex:none}
.task{border-left:4px solid var(--red);padding:8px 12px;background:var(--red-soft);border-radius:0 8px 8px 0}

/* Test */
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
.bigplay{width:88px;height:88px;border-radius:50%;background:var(--green);color:var(--on-green);border:0;cursor:pointer;display:grid;place-items:center;margin:0 auto}
.bigplay svg{width:30px;height:30px;fill:currentColor}
.result-level{font-family:var(--f-display);font-size:2rem;font-weight:900;color:var(--green)}
table.simple{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.simple td,table.simple th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tablewrap{overflow-x:auto}
.dict-ans{font-size:1.3rem;font-weight:700}
.badge{display:inline-block;min-width:1.4em;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--red);color:var(--on-green);font-size:.72rem;line-height:1.5;text-align:center;font-variant-numeric:tabular-nums}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grades{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grade{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:10px 6px;cursor:pointer;display:grid;gap:2px;justify-items:center;text-align:center}
.grade span{font-size:.75rem;color:var(--muted)}
.grade em{font-style:normal;font-family:var(--f-mono);font-size:.8rem}
.grade.g1{border-color:var(--red)} .grade.g1 b,.grade.g1 em{color:var(--red)}
.grade.g2 b,.grade.g2 em{color:var(--amber)}
.grade.g3{border-color:var(--green)} .grade.g3 b,.grade.g3 em{color:var(--green)}
.grade.g4 b,.grade.g4 em{color:var(--green)}
.grade:hover{background:var(--green-soft)}
.fc{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;align-items:end;height:110px}
.fcol{display:grid;justify-items:center;align-content:end;gap:3px;height:100%}
.fcol i{display:block;width:70%;background:var(--green);border-radius:3px 3px 0 0;min-height:1px}
.fcol .fn{font-size:.7rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.fcol .fd{font-size:.62rem;color:var(--muted);white-space:nowrap}
svg.curve{width:100%;min-width:420px;height:auto;display:block}
svg.curve path{fill:none;stroke-width:2.5}
svg.curve .gl{stroke:var(--line);stroke-width:1}
svg.curve .g90{stroke:var(--muted);stroke-dasharray:4 4}
svg.curve text{fill:var(--muted);font-size:11px;font-family:var(--f-mono)}
svg.curve .lab90{fill:var(--ink)}
.ava{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:.72rem;font-weight:700;margin-right:6px;vertical-align:middle;flex:none}
.ava.big{width:44px;height:44px;font-size:1.1rem;margin:0}
.spk b{color:var(--ink);font-weight:600}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.castc{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);cursor:pointer}
.castc:hover{border-color:var(--green)}
.castc>span:last-child{display:grid;gap:2px;min-width:0}
.castc .muted{font-size:.8rem}
.castc em{font-style:normal;font-size:.85rem;color:var(--green)}
.egg{border-color:var(--amber);background:linear-gradient(0deg,var(--card),var(--card)) padding-box}
.egg .phrase{font-size:1.6rem;font-weight:700;font-family:var(--f-display)}
.egg .note{background:var(--amber-soft);border-radius:8px;padding:10px 12px;font-size:.92rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bdg{display:grid;justify-items:center;text-align:center;gap:4px;padding:10px 6px;border:1px dashed var(--line);border-radius:10px;opacity:.55}
.bdg .medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:1.2rem;background:var(--line);color:var(--muted)}
.bdg b{font-size:.88rem}.bdg span{font-size:.72rem;color:var(--muted)}
.bdg.got{opacity:1;border-style:solid;border-color:var(--amber);background:var(--amber-soft)}
.bdg.got .medal{background:var(--amber);color:#fff}
.gamehud{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-variant-numeric:tabular-nums}
.gamehud b{font-family:var(--f-display);font-size:1.3rem}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--green);transition:width .1s linear}
.timer.low i{background:var(--red)}
.combo{color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="plate">
    <div>
      <div class="sub">粵語聽力 · 八星期路線</div>
      <h1>港話聽力課</h1>
    </div>
    <div class="stats">
      <div><b id="st-done">0</b><span>已完成課</span></div>
      <div><b id="st-streak">0</b><span>連續日數</span></div>
      <div><b id="st-level">—</b><span>測驗程度</span></div>
    </div>
  </header>

  <nav class="tabs" aria-label="主選單">
    <a href="#today">今日</a>
    <a href="#route">八星期路線</a>
    <a href="#test">聽力測驗</a>
    <a href="#review">複習<span id="due-badge" class="badge" hidden></span></a>
    <a href="#game">遊戲</a>
  </nav>

  <div id="voice-warn" class="notice" hidden></div>

  <main id="view"></main>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script>
/* ---------------- Data ---------------- */
const WEEKS = [
  {n:1, name:"高頻助詞 + 生活起步", goal:"聽出 咗 / 緊 / 未 / 啦 / 喎 / 咋，聽懂數字同價錢", lessons:[1,2,3,4,5]},
  {n:2, name:"出行、辦公室、生活服務", goal:"聽懂小巴港鐵、IT 求助、睇醫生、管理處、約飯局", lessons:[6,7,8,9,10]},
  {n:3, name:"辦公室日常（深化）", goal:"借嘢、搵人、交件、請假、中英夾雜詞"},
  {n:4, name:"會議與電話", goal:"跟得上會議大意：改期、跟進、deadline、approve"},
  {n:5, name:"銀行、購物、退換", goal:"櫃位對話、八達通、轉數快、退貨、投訴"},
  {n:6, name:"社交吹水", goal:"八卦、抱怨、讚人、飯局話題、常見俗語"},
  {n:7, name:"語速提升", goal:"1.15 倍速盲聽、連讀吞音、電話音質"},
  {n:8, name:"真實素材衝刺", goal:"新聞片段、港劇對白、會議錄音，綜合測驗"}
];

const LESSONS = {
1:{title:"早晨，你食咗早餐未？",scene:"辦公室 · 朝早喺 lift 口撞到同事",focus:"咗（了）· 緊（正在）· 未（還沒）· 先（先…再）",
 task:"今日留意同事講「…咗」「…緊」，記低最少兩句。",
 lines:[
 ["Amy","早晨！今日咁早嘅？","早上好！今天這麼早？"],
 ["你","早晨！係呀，今日要開會，所以早咗出門。","早上好！對，今天要開會，所以早點出門了。"],
 ["Amy","你食咗早餐未呀？","你吃早餐了嗎？"],
 ["你","未呀，等陣先落去買。你呢？","還沒，等一下再下去買。你呢？"],
 ["Amy","我食緊喇，喺樓下買咗個菠蘿油。","我正在吃，在樓下買了個菠蘿油。"],
 ["你","哇，好香呀！咁我都去買個先。","哇，好香！那我也先去買一個。"],
 ["Amy","快啲啦，九點半就開會喇。","快點吧，九點半就開會了。"]],
 vocab:[["早晨","zou2 san4","早上好"],["咗","zo2","了（完成）"],["緊","gan2","正在"],["未","mei6","還沒／…了嗎"],["等陣","dang2 zan6","等一下"],["落去","lok6 heoi3","下去"],["菠蘿油","bo1 lo4 jau4","夾牛油的菠蘿包"],["快啲","faai3 di1","快點"]],
 qs:[["點解今日咁早返工？",["要開會","要交報告","想買早餐","搭錯車"],0],["Amy 而家做緊乜？",["買緊早餐","食緊菠蘿油","開緊會","等緊 lift"],1],["幾點開會？",["九點","九點半","十點","十點半"],1]]},
2:{title:"茶餐廳落單",scene:"生活 · 中午一個人去茶餐廳",focus:"搭枱 · 凍飲加錢 · 少甜／走冰 · 埋單",
 task:"今日去茶餐廳或者外賣，用粵語講「凍檸茶少甜」或者「走冰」。",
 lines:[
 ["伙記","幾位呀？","幾位？"],
 ["你","一位。","一位。"],
 ["伙記","搭枱得唔得呀？","拼桌可以嗎？"],
 ["你","得，冇問題。","可以，沒問題。"],
 ["伙記","食乜嘢？","吃什麼？"],

/* Split text into syllable tokens (each Chinese character, each English word) and punctuation, then pair syllables with jyutping. */
function tokenize(text){return text.match(/[A-Za-z][A-Za-z']*|[㐀-鿿豈-﫿]|\S/gu)||[]}
const isSyl=t=>/^[A-Za-z]|^[㐀-鿿豈-﫿]$/u.test(t);
function rubyHTML(text,jp){
  const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  if(!jp)return e(text);
  const toks=tokenize(text),syl=jp.trim().split(/\s+/);
  if(toks.filter(isSyl).length!==syl.length)return e(text)+`<span class="jpline">${e(jp)}</span>`;
  let k=0,out="";
  for(const t of toks){
    if(!isSyl(t)){out+=`<span class="punc">${e(t)}</span>`;continue}
    const j=syl[k++];
    out+= /^[A-Za-z]/.test(t)&&j===t ? `<ruby class="en">${e(t)}<rt>&nbsp;</rt></ruby>` : `<ruby>${e(t)}<rt data-tone="${(j.match(/\d$/)||[""])[0]}">${e(j)}</rt></ruby>`;
  }
  return out;
}

  const days=new Set(Object.values(S.done));let n=0;const d=new Date();
  if(!days.has(today()))d.setDate(d.getDate()-1);

}

    w.innerHTML='<b>未搵到粵語（香港）發音。</b> 而家會用其他中文聲音讀出，發音唔準。Mac：系統設定 → 輔助使用 → 朗讀內容 → 系統聲音 → 管理聲音，下載「中文（香港）」嘅聲音（例如 Sinji），然後重新開呢頁。iPhone：設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文（香港）。';

if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,opts={}){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){res();return}
    const u=new SpeechSynthesisUtterance(text.replace(/\s+/g," "));
    u.lang="zh-HK"; if(hkVoice)u.voice=hkVoice;
    u.rate=opts.rate||rate; u.pitch=opts.pitch||1;
    u.onend=res;u.onerror=res;
    speechSynthesis.speak(u);
  });
}
/* Recorded neural-voice clips (audio/<key>.mp3); falls back to the device voice if a clip is missing. */
const AUDIO=typeof Audio!=="undefined"?new Audio():null;
let ttsUsed=false;
function stopSpeak(){if("speechSynthesis" in window)speechSynthesis.cancel();if(AUDIO){AUDIO.onended=AUDIO.onerror=null;try{AUDIO.pause()}catch(e){}}}
/* The offline build ships every clip inside audio-pack.js (one file to upload); otherwise clips load from audio/. */
const blobURLs={};
function clipURL(key){
  const P=window.AUDIO_PACK;
  if(P&&P[key]){
    if(!blobURLs[key]){const b=atob(P[key]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);blobURLs[key]=URL.createObjectURL(new Blob([u],{type:"audio/mpeg"}))}
    return blobURLs[key];
  }
  return "audio/"+key+".mp3";
}
function playClip(key,text,o={}){
  return new Promise(res=>{
    stopSpeak();
    const viaTTS=()=>{ttsUsed=true;pickVoice();speak(text,o.tts||{}).then(res)};
    if(!AUDIO||!key){viaTTS();return}
    let settled=false;
    const fin=()=>{if(settled)return;settled=true;AUDIO.onended=AUDIO.onerror=null;res()};
    const fallback=()=>{if(settled)return;settled=true;AUDIO.onended=AUDIO.onerror=null;viaTTS()};
    AUDIO.onended=fin;AUDIO.onerror=fallback;
    const r=o.playRate||rate;
    AUDIO.src=clipURL(key);
    AUDIO.preservesPitch=true;AUDIO.webkitPreservesPitch=true;
    AUDIO.defaultPlaybackRate=r;AUDIO.playbackRate=r;
    const pr=AUDIO.play();
    if(pr&&pr.catch)pr.catch(e=>{if(e&&e.name==="NotAllowedError")fin();else if(e&&e.name!=="AbortError")fallback()});
  });
}

function bindTones(root){

    ${S.test?`<p><span class="pill">上次：${esc(S.test.level)}，${S.test.score}/15（${esc(S.test.date)}）</span></p>`:""}

  if(T.plays>=3)tp.disabled=true;
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(T.plays===0){tp.focus();tp.animate?.([{transform:"scale(1)"},{transform:"scale(1.08)"},{transform:"scale(1)"}],{duration:300});return}
    T.ans.push({ok:Number(b.dataset.o)===q.a,pick:Number(b.dataset.o),plays:T.plays});

}
function testResult(){
  const score=T.ans.filter(a=>a.ok).length;
  const by={};TEST.forEach((q,i)=>{by[q.lv]=by[q.lv]||{ok:0,n:0};by[q.lv].n++;if(T.ans[i].ok)by[q.lv].ok++});
  let level,advice;
  if(score<=4){level="L1 入門";advice="由 Day 1 開始，每課盲聽多聽一次（三次），語速固定 0.75×，先建立對「咗／緊／未」嘅反應。"}
  else if(score<=8){level="L2 關鍵詞";advice="同你自評一致。由 Day 1 開始照路線行，語速用 0.9×，盲聽兩次後先睇字。"}
  else if(score<=12){level="L3 日常";advice="Day 1–3 可以一日做兩課快速過，由 Day 4 開始正常進度，語速用 1.0×，重點放喺辦公室同中英夾雜。"}
  else{level="L4 進階";advice="第 1 週快速過一次當重溫，直接用 1.15× 盲聽。同老師講「跳去第 4 週」，我會出會議同新聞程度嘅材料。"}
  const weak=Object.entries(by).filter(([k,v])=>v.ok/v.n<0.75).map(([k])=>LV_NAME[k]);
  S.test={score,level,date:today(),by};T.ans.forEach((a,i)=>{if(!a.ok)addCard(`t0-${i}`)});save();refreshStats();
  const wrong=T.ans.map((a,i)=>({a,i,q:TEST[i],jp:TEST_JP[i]})).filter(x=>!x.a.ok);
  view.innerHTML=`<section class="card">

    <p>答啱 <b>${score} / 15</b>。${esc(advice)}</p>
    ${weak.length?`<p>要加強：${weak.map(w=>`<span class="pill red">${esc(w)}</span>`).join(" ")}</p>`:""}
    <div class="tablewrap"><table class="simple"><thead><tr><th>部分</th><th>答啱</th></tr></thead><tbody>
    ${Object.entries(by).map(([k,v])=>`<tr><td>${LV_NAME[k]}</td><td>${v.ok} / ${v.n}</td></tr>`).join("")}</tbody></table></div>
    ${wrong.length?`<div class="eyebrow">答錯嘅題（撳嚟再聽）</div><div>${wrong.map(x=>`<div class="line"><button class="playbtn" data-yue="${esc(x.q.yue)}" data-key="t${x.i}" aria-label="再聽">${PLAY}</button><div class="yue has-jp">${rubyHTML(x.q.yue,x.jp)}</div><div class="zh">${esc(x.q.opts[x.q.a])}</div></div>`).join("")}</div>`:""}
    <div class="row"><a class="btn primary" href="#today">返去今日課堂</a><button class="btn" id="retest">再測一次</button></div>
    <p class="muted" style="font-size:.85rem">想我再細啲分析？將呢個分數同答錯嘅題目話俾老師聽（直接喺對話入面講就得）。</p>
  </section>`;
  view.querySelectorAll("[data-yue]").forEach(b=>b.onclick=()=>playClip(b.dataset.key,b.dataset.yue));
  document.getElementById("retest").onclick=()=>{T={i:0,ans:[],plays:0};vTest()};
}

/* ---------------- Spaced repetition (FSRS-4.5) ----------------
   Forgetting curve: R(t) = (1 + F·t/S)^-0.5, F = 19/81, so R = 90% exactly when t = S.
   S = stability (days until recall drops to 90%), D = difficulty (1–10).
   Default weights are FSRS-4.5's, fitted on a large body of Anki review logs. */
const FSRS={
  w:[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755],
  DECAY:-0.5, F:19/81, RET:0.9, MAXI:365
};
const clampD=d=>Math.min(10,Math.max(1,d));
const dayNum=s=>{const [y,m,d]=s.split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const numDay=n=>{const t=new Date(n*864e5);return t.getUTCFullYear()+"-"+String(t.getUTCMonth()+1).padStart(2,"0")+"-"+String(t.getUTCDate()).padStart(2,"0")};
function retr(t,s){return Math.pow(1+FSRS.F*t/s,FSRS.DECAY)}
function ivl(s){return Math.min(FSRS.MAXI,Math.max(1,Math.round(s/FSRS.F*(Math.pow(FSRS.RET,1/FSRS.DECAY)-1))))}
/* Returns the card's next state for grade g (1 重來, 2 困難, 3 良好, 4 簡單) reviewed on day `now` */
function schedule(c,g,now){
  const w=FSRS.w; let s,d;
  if(c.state==="new"){
    s=w[g-1]; d=clampD(w[4]-(g-3)*w[5]);
  }else{
    const t=Math.max(0,now-dayNum(c.last)); const R=retr(t,c.s);
    const d0=w[4]-(4-3)*w[5];
    d=clampD(w[7]*d0+(1-w[7])*(c.d-w[6]*(g-3)));
    if(g===1){
      s=Math.min(c.s, w[11]*Math.pow(d,-w[12])*(Math.pow(c.s+1,w[13])-1)*Math.exp(w[14]*(1-R)));
    }else{
      s=c.s*(Math.exp(w[8])*(11-d)*Math.pow(c.s,-w[9])*(Math.exp(w[10]*(1-R))-1)*(g===2?w[15]:1)*(g===4?w[16]:1)+1);
    }
  }
  s=Math.max(0.1,s);
  const days=g===1?0:ivl(s);
  return {...c,s,d,state:"review",last:numDay(now),due:numDay(now+days),reps:(c.reps||0)+1,lapses:(c.lapses||0)+(g===1&&c.state!=="new"?1:0),days};
}
const fmtDays=n=>n===0?"今日再嚟":n<30?`${n} 日`:n<365?`${Math.round(n/30)} 個月`:"1 年";

/* Card content lookup */
function cardContent(id){
  const m=id.match(/^([vst])(\d+)-(\d+)$/); if(!m)return null;
  const [,k,a,b]=m; const L=LESSONS[a];
  if(k==="v"&&L&&L.vocab[b]){const v=L.vocab[b];return {key:`v${a}-${b}`,yue:v[0],jp:v[1],zh:v[2],src:`Day ${a} 詞語`}}
  if(k==="s"&&L&&L.lines[b]){const l=L.lines[b];return {key:`l${a}-${b}`,yue:l[1],jp:(JP[a]||[])[b],zh:l[2],src:`Day ${a} 對話`}}
  if(k==="t"&&TEST[b]){const q=TEST[b];return {key:`t${b}`,yue:q.yue,jp:TEST_JP[b],zh:q.opts[q.a],src:"測驗錯題"}}
  return null;
}
function addCard(id){if(!S.cards[id]&&cardContent(id))S.cards[id]={state:"new",added:today()}}
function addLessonCards(lid){const L=LESSONS[lid];if(!L)return;L.vocab.forEach((_,i)=>addCard(`v${lid}-${i}`));L.lines.forEach((_,i)=>addCard(`s${lid}-${i}`))}
const NEW_PER_DAY=20;
function newLeft(){return S.newDay&&S.newDay.date===today()?Math.max(0,NEW_PER_DAY-S.newDay.n):NEW_PER_DAY}
function dueIds(){
  const t=dayNum(today());
  const due=Object.entries(S.cards).filter(([,c])=>c.state!=="new"&&dayNum(c.due)<=t).sort((a,b)=>dayNum(a[1].due)-dayNum(b[1].due)).map(([k])=>k);
  const fresh=Object.entries(S.cards).filter(([,c])=>c.state==="new").sort((a,b)=>a[1].added<b[1].added?-1:1).map(([k])=>k).slice(0,newLeft());
  return {due,fresh};
}
function dueCount(){const q=dueIds();return q.due.length+q.fresh.length}

/* Review session */
let R=null;
function startSession(){const q=dueIds();R={queue:[...q.due,...q.fresh],shown:false,done:0,again:0,startedPlay:false};}
function vReview(){
  if(!R||(!R.queue.length&&R.done===0))startSession();
  const total=Object.keys(S.cards).length;
  if(!R.queue.length){
    view.innerHTML=`<div style="display:grid;gap:20px"><section class="card">
      <div class="eyebrow">今日複習</div>
      <h2>${R.done?`做完喇！今日複習咗 ${R.done} 張`:total?"今日冇卡要複習":"卡組仲係空嘅"}</h2>
      <p class="muted">${total?`卡組一共 ${total} 張。下面係之後 14 日每日要複習幾多張。`:"完成一課之後，嗰課嘅重點詞同對話句子會自動加入卡組；測驗答錯嘅題目都會加入。"}</p>
      ${total?forecastHTML():""}
      <div class="row">${total?"":`<a class="btn primary" href="#today">去上第一課</a>`}</div>
    </section>${curveCard()}</div>`;
    R=null; return;
  }
  const id=R.queue[0], c=S.cards[id], cc=cardContent(id);
  if(!cc){R.queue.shift();delete S.cards[id];save();return vReview()}
  const now=dayNum(today());
  const prev=[1,2,3,4].map(g=>schedule(c,g,now).days);
  const isNew=c.state==="new";
  view.innerHTML=`<div style="display:grid;gap:20px"><section class="card">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">今日複習 · 尚餘 ${R.queue.length} 張</span><span>${isNew?'<span class="pill amber">新卡</span>':`<span class="pill">上次 ${esc(c.last)} · 第 ${c.reps+1} 次</span>`}</span></div>
    <p class="muted" style="text-align:center">${R.shown?"對答案，然後揀你啱先嘅表現":"先聽，喺心入面講出意思，再揭答案"}</p>
    <div class="row" style="justify-content:center;gap:16px"><button class="bigplay" id="rplay" aria-label="播放">${PLAY}</button></div>
    <div class="row" style="justify-content:center">${rateSeg()}</div>
    ${R.shown?`<div style="text-align:center;display:grid;gap:6px">
        <div class="dict-ans yue has-jp ${showJP?"":"hidejp"}">${rubyHTML(cc.yue,cc.jp)}</div>
        <p>${esc(cc.zh)}</p><p class="muted" style="font-size:.85rem">出自 ${esc(cc.src)}</p></div>
      <div class="grades">
        ${[["重來","完全聽唔明",1],["困難","諗咗好耐／半估",2],["良好","聽得明",3],["簡單","一聽就明",4]].map(([n,h,g])=>`<button class="grade g${g}" data-g="${g}"><b>${n}</b><span>${h}</span><em>${fmtDays(prev[g-1])}</em></button>`).join("")}
      </div>`
    :`<div class="row" style="justify-content:center"><button class="btn primary" id="rshow">揭答案</button></div>`}
  </section>
  <p class="muted" style="font-size:.85rem;text-align:center">快捷鍵：空白鍵 播放／揭答案 · 1 2 3 4 評分</p></div>`;
  bindRate(view);
  const play=()=>playClip(cc.key,cc.yue);
  document.getElementById("rplay").onclick=play;
  if(!R.startedPlay){R.startedPlay=true;play()}
  const sh=document.getElementById("rshow");if(sh)sh.onclick=()=>{R.shown=true;vReview()};
  view.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(Number(b.dataset.g)));
}
function grade(g){
  if(!R||!R.shown)return;
  const id=R.queue.shift(), c=S.cards[id];
  if(c.state==="new"){S.newDay=S.newDay&&S.newDay.date===today()?S.newDay:{date:today(),n:0};S.newDay.n++}
  S.cards[id]=schedule(c,g,dayNum(today()));
  S.revDays=S.revDays||{};S.revDays[today()]=(S.revDays[today()]||0)+1;
  if(g===1)R.queue.push(id);
  R.done++;R.shown=false;R.startedPlay=false;save();refreshStats();vReview();
}
document.addEventListener("keydown",e=>{
  if(location.hash!=="#review"||!R||e.target.closest("input,select,textarea"))return;
  if(e.key===" "){e.preventDefault();if(R.shown)document.getElementById("rplay")?.click();else{R.shown=true;vReview()}}
  else if(R.shown&&/^[1-4]$/.test(e.key))grade(Number(e.key));
});

function forecastHTML(){
  const t=dayNum(today()),days=[...Array(14)].map((_,i)=>0);
  Object.values(S.cards).forEach(c=>{if(c.state==="new")return;const k=Math.max(0,dayNum(c.due)-t);if(k<14)days[k]++});
  const mx=Math.max(1,...days);
  return `<div class="fc">${days.map((n,i)=>`<div class="fcol"><span class="fn">${n||""}</span><i style="height:${n/mx*60}px"></i><span class="fd">${i===0?"今日":i===1?"聽日":"+"+i}</span></div>`).join("")}</div>`;
}
function curveCard(){
  // Draw R(t) for stabilities a card typically reaches after successive "良好" reviews
  const W=560,H=200,pl=40,pr=12,pt=12,pb=30,T=60;
  const x=t=>pl+(W-pl-pr)*t/T, y=r=>pt+(H-pt-pb)*(1-r)/(1-0.5);
  const Ss=[{s:3.7,lab:"第 1 次"},{s:14.9,lab:"第 2 次"},{s:50,lab:"第 3 次"}];
  const cols=["var(--red)","var(--amber)","var(--green)"];
  const path=s=>[...Array(121)].map((_,i)=>{const t=i/2;const r=Math.max(.5,retr(t,s));return (i?"L":"M")+x(t).toFixed(1)+" "+y(r).toFixed(1)}).join("");
  const grid=[1,.9,.8,.7,.6,.5].map(r=>`<line x1="${pl}" x2="${W-pr}" y1="${y(r)}" y2="${y(r)}" class="gl${r===.9?" g90":""}"/><text x="${pl-6}" y="${y(r)+4}" text-anchor="end">${Math.round(r*100)}%</text>`).join("");
  const xt=[0,10,20,30,40,50,60].map(t=>`<text x="${x(t)}" y="${H-10}" text-anchor="middle">${t}</text>`).join("");
  return `<section class="card">
    <div class="eyebrow">點解咁排複習時間</div>
    <h3>每複習一次，遺忘曲線就變平啲</h3>
    <div class="tablewrap"><svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="記憶保留率隨日數下降的曲線，三條線分別代表複習一、二、三次之後">
      ${grid}${xt}
      ${Ss.map((o,i)=>`<path d="${path(o.s)}" style="stroke:${cols[i]}"/>`).join("")}
      <text x="${W-pr}" y="${y(.9)-5}" text-anchor="end" class="lab90">目標 90%</text>
    </svg></div>
    <div class="legend">${Ss.map((o,i)=>`<span><i style="background:${cols[i]}"></i>${o.lab}複習後（約 ${Math.round(o.s)} 日跌到 90%）</span>`).join("")}<span>橫軸：日數</span></div>
    <p class="muted" style="font-size:.88rem">呢個係 Ebbinghaus 遺忘曲線嘅現代版本。排程用 FSRS 演算法（Anki 而家預設用嘅），按你每次「重來／困難／良好／簡單」計出每張卡記得幾牢，喺記憶跌到大約 90% 嗰日先叫你複習。記得越牢，下次隔得越耐，所以每日複習量唔會越堆越多。</p>
  </section>`;
}

  {id:"score",  g:"快",name:"快槍手",    desc:"一局遊戲得 2000 分",      test:()=>(S.game.best||0)>=2000},
  {id:"test15", g:"滿",name:"滿分耳朵",  desc:"聽力測驗 15 題全啱",      test:()=>!!S.test&&S.test.score===15},
  {id:"slang10",g:"俗",name:"俗語收藏家",desc:"揭開 10 個俗語彩蛋",      test:()=>Object.keys(S.slang||{}).length>=10}
];
function badgesHTML(){
  return `<div class="badges">${BADGES.map(b=>{const got=S.badges[b.id];return `<div class="bdg ${got?"got":""}" title="${got?"解鎖於 "+got:"未解鎖"}"><span class="medal">${b.g}</span><b>${b.name}</b><span>${b.desc}</span></div>`}).join("")}</div>`;
}
let toastT=null;
function toast(msg){const t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function checkBadges(){
  const fresh=BADGES.filter(b=>!S.badges[b.id]&&b.test());
  if(!fresh.length)return;
  fresh.forEach(b=>S.badges[b.id]=today());save();
  toast("解鎖徽章：「"+fresh.map(b=>b.name).join("」「")+"」");
}

/* 極速聽力搶答: 10 questions, 12 s each, points for speed and combos */
let G=null,GT=null;
const GQ=10,GSEC=12;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gamePool(){
  const ids=Object.keys(S.done).map(Number);const use=ids.length?ids:[1,2,3];
  const p=[];use.forEach(id=>{const L=LESSONS[id];if(!L)return;
    L.lines.forEach((l,i)=>p.push({key:`l${id}-${i}`,yue:l[1],jp:(JP[id]||[])[i],zh:l[2],t:"s"}));
    L.vocab.forEach((v,i)=>p.push({key:`v${id}-${i}`,yue:v[0],jp:v[1],zh:v[2],t:"v"}))});
  return p;
}
function newGame(){
  const pool=gamePool();
  const qs=shuffle(pool.slice()).slice(0,GQ).map(it=>{
    let others=shuffle(pool.filter(o=>o.zh!==it.zh&&o.t===it.t)).slice(0,3);
    if(others.length<3)others=others.concat(shuffle(pool.filter(o=>o.zh!==it.zh&&!others.includes(o))).slice(0,3-others.length));
    return {it,opts:shuffle([it,...others])};
  });
  G={qs,i:0,score:0,combo:0,maxCombo:0,right:0,picked:null,left:GSEC,over:false,missed:[]};
}
function vGame(){
  clearInterval(GT);
  if(!G){
    view.innerHTML=`<div style="display:grid;gap:20px"><section class="card">
      <div class="eyebrow">聽力小遊戲</div><h2>極速聽力搶答</h2>
      <p>一局 ${GQ} 題，每題 ${GSEC} 秒。聽一句粵語，揀啱普通話意思。答得快有時間獎分，連續答啱有連擊加分。</p>
      <p class="muted">題目嚟自你完成咗嘅課${Object.keys(S.done).length?"":"（未完成任何課，先用 Day 1–3）"}。</p>
      <div class="gamehud"><span>最高分 <b>${S.game.best||0}</b></span><span>最長連擊 <b>${S.game.bestCombo||0}</b></span><span>玩咗 <b>${S.game.plays||0}</b> 局</span></div>
      <div class="row"><button class="btn primary" id="gstart">${PLAY}<span>開始遊戲</span></button></div>
    </section>
    <section class="card"><div class="row" style="justify-content:space-between"><span class="eyebrow">徽章</span><span class="muted">${Object.keys(S.badges).length} / ${BADGES.length}</span></div>${badgesHTML()}</section></div>`;
    document.getElementById("gstart").onclick=()=>{newGame();vGame()};
    return;
  }
  if(G.over)return gameResult();
  const q=G.qs[G.i];
  const pk=G.picked;
  view.innerHTML=`<section class="card">
    <div class="gamehud"><span>第 <b>${G.i+1}</b> / ${GQ} 題</span><span>分數 <b id="gscore">${G.score}</b></span><span class="combo">${G.combo>1?"連擊 ×"+G.combo:""}</span></div>
    <div class="timer" id="gtimer"><i style="width:${G.left/GSEC*100}%"></i></div>
    <button class="bigplay" id="gplay" aria-label="再聽一次">${PLAY}</button>
    <div class="opts">${q.opts.map((o,oi)=>{let cls="";if(pk){if(o===q.it)cls="right";else if(oi===pk.oi)cls="wrong"}return `<button class="opt ${cls}" data-o="${oi}" ${pk?"disabled":""}>${esc(o.zh)}</button>`}).join("")}</div>
    ${pk?`<div style="display:grid;gap:6px;text-align:center">
        <p><b style="color:${pk.correct?"var(--green)":"var(--red)"}">${pk.correct?`答啱！+${pk.pts}`:pk.oi<0?"夠鐘喇！":"差少少！"}</b></p>
        <div class="dict-ans yue has-jp">${rubyHTML(q.it.yue,q.it.jp)}</div>
      </div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="gnext">${G.i+1<GQ?"下一題 →":"睇結果"}</button></div>`:""}
  </section>`;
  const play=()=>playClip(q.it.key,q.it.yue);
  document.getElementById("gplay").onclick=play;
  if(!pk){
    play();
    view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>gAnswer(Number(b.dataset.o)));
    const bar=document.querySelector("#gtimer");
    GT=setInterval(()=>{G.left=Math.max(0,G.left-0.1);bar.firstElementChild.style.width=(G.left/GSEC*100)+"%";bar.classList.toggle("low",G.left<4);if(G.left<=0)gAnswer(-1)},100);
  }else{
    document.getElementById("gnext").onclick=()=>{G.i++;G.picked=null;G.left=GSEC;if(G.i>=GQ)G.over=true;vGame()};
  }
}
function gAnswer(oi){
  clearInterval(GT);
  const q=G.qs[G.i];const correct=oi>=0&&q.opts[oi]===q.it;let pts=0;
  if(correct){G.combo++;pts=100+Math.round(G.left)*10+(G.combo-1)*20;G.score+=pts;G.right++;G.maxCombo=Math.max(G.maxCombo,G.combo)}
  else{G.combo=0;G.missed.push(q.it)}
  G.picked={oi,correct,pts};
  vGame();
}
function gameResult(){
  const rec=G.score>(S.game.best||0);
  S.game.best=Math.max(S.game.best||0,G.score);S.game.bestCombo=Math.max(S.game.bestCombo||0,G.maxCombo);S.game.plays=(S.game.plays||0)+1;save();refreshStats();
  const verdict=G.right>=9?"耳仔好醒！":G.right>=6?"幾好喎，繼續努力！":"唔緊要，多聽幾次就得！";
  view.innerHTML=`<section class="card">
    <div class="eyebrow">遊戲結果</div>
    <div class="result-level">${G.score} 分</div>
    <p>${verdict} 答啱 <b>${G.right} / ${GQ}</b> · 最長連擊 <b>${G.maxCombo}</b> ${rec?'<span class="pill amber">新紀錄！</span>':""}</p>
    ${G.missed.length?`<div class="eyebrow">答錯嘅（撳嚟再聽）</div><div>${G.missed.map(it=>`<div class="line"><button class="playbtn" data-key="${it.key}" data-text="${esc(it.yue)}" aria-label="再聽">${PLAY}</button><div class="yue has-jp">${rubyHTML(it.yue,it.jp)}</div><div class="zh">${esc(it.zh)}</div></div>`).join("")}</div>`:""}
    <div class="row"><button class="btn primary" id="gagain">再玩一局</button><a class="btn" href="#today">返去今日</a></div>
  </section>`;
  view.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>playClip(b.dataset.key,b.dataset.text));
  document.getElementById("gagain").onclick=()=>{newGame();vGame()};
  G.over="shown";
}

/* ---------------- Router ---------------- */
function route(){
  stopSpeak();clearInterval(GT);
  const h=(location.hash||"#today").slice(1);
  let tab=h;
  if(/^l\d+$/.test(h)){tab="route";vLesson(Number(h.slice(1)))}
  else if(h==="route")vRoute();
  else if(h==="test")vTest();
  else if(h==="review")vReview();
  else if(h==="game")vGame();
  else{tab="today";vToday()}
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.getAttribute("href")==="#"+tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  refreshStats();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
Object.keys(S.done).forEach(id=>addLessonCards(Number(id)));save();
route();
</script>
